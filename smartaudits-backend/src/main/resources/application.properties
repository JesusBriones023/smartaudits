# Configuración del servidor
spring.application.name=smartaudits-backend
server.port=8080

# Configuración de base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================================
# Flyway - migraciones versionadas
# ============================================================================
# Durante la preparación de la fase 0.8 permanece desactivado.
# No activar contra una BD existente hasta validar el baseline en MariaDB aislada.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# Solo se utilizará conscientemente al adoptar una BD histórica sin
# flyway_schema_history. Nunca debe quedar activado por accidente.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Legacy SmartAudits schema
spring.flyway.validate-on-migrate=true

# Impide que Flyway CLEAN pueda borrar el esquema.
spring.flyway.clean-disabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# ============================================================================
# Bootstrap del administrador raíz
# ----------------------------------------------------------------------------
# Si al arrancar la aplicación NO existe ningún ADMIN en BD, se crea uno
# automáticamente con las credenciales suministradas vía variables de entorno.
#
# IMPORTANTE: por seguridad, NO se proporcionan valores por defecto.
# Si las variables de entorno no están definidas, el bootstrap se omite y
# el sistema arranca normalmente sin crear ningún administrador.
#
# Variables esperadas (definir antes de arrancar el backend):
#   SMARTAUDITS_ADMIN_EMAIL    - email del administrador raíz
#   SMARTAUDITS_ADMIN_PASSWORD - contraseña inicial (cámbiarla tras el primer login)
#   SMARTAUDITS_ADMIN_NOMBRE   - nombre completo (opcional)
#
# ============================================================================
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${SMARTAUDITS_ADMIN_EMAIL:}
app.admin.bootstrap.password=${SMARTAUDITS_ADMIN_PASSWORD:}
app.admin.bootstrap.nombre=${SMARTAUDITS_ADMIN_NOMBRE:Administrador}

# Inicialización de datos base (roles + posible bootstrap admin).
# Durante una adopción histórica de Flyway se desactiva completamente.
app.data.initializer.enabled=${APP_DATA_INITIALIZER_ENABLED:true}

# Logging
logging.level.com.smartaudits=INFO
logging.level.org.springframework.security=INFO

# Cuota técnica antiabuso de auditorías
# Billing sustituirá este límite por entitlements por plan.
app.audit.daily-limit=${AUDIT_DAILY_LIMIT:100}